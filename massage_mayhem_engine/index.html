<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Massage Mayhem · 规则原型</title><style>
:root{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#422e33;background:#faeee6}body{margin:0;padding:20px}.app{max-width:1000px;margin:auto}h1{margin:0 0 3px}.sub{color:#826b72;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:white;border:2px solid #e8cfc5;border-radius:16px;padding:18px;box-shadow:0 4px 0 #e9d1c8}label{display:block;margin:10px 0 5px;font-weight:bold}select,button{font:inherit;border-radius:9px;padding:9px;border:1px solid #c7a5a0;background:#fff}button{background:#f9ceaf;cursor:pointer;margin:4px}button:hover{background:#f4b887}button:disabled{opacity:.4}#scene{position:relative;height:280px;border-radius:14px;background:linear-gradient(145deg,#f8d7bf,#e1afae);overflow:hidden;text-align:center;display:flex;align-items:center;justify-content:center}#guest{font-size:98px;transition:transform .18s}#therapist{font-size:68px;position:absolute;bottom:8px;right:60px}#sceneLabel{position:absolute;top:12px;left:14px;font-weight:bold}#effect{position:absolute;left:0;right:0;top:58px;font-size:28px;color:#b44e6b}.meters{display:grid;gap:9px}.meter{display:flex;align-items:center;gap:10px}.meter span{width:105px}.track{flex:1;background:#ead9d2;height:14px;border-radius:9px;overflow:hidden}.fill{height:100%;background:#df8b87;transition:width .18s}#log{max-height:180px;overflow:auto;font-size:13px;background:#fff8f3;padding:12px;border-radius:10px;white-space:pre-line}#results{font-weight:bold} @media(max-width:660px){.grid{grid-template-columns:1fr}#scene{height:225px}}</style></head><body><div class="app"><h1>💆 Massage Mayhem</h1><p class="sub">统一卡通风规则验证 Demo · 技师 × 顾客 × 服务</p><div class="grid"><div class="card"><h3>准备关卡</h3><label>玩家选择技师</label><select id="therapist"></select><label>系统生成顾客（开发调试可切换）</label><select id="guest"></select><label>按摩场景</label><select id="sceneChoice"></select><button id="start">开始 / 重开关卡</button><p id="intro"></p><p id="characterInfo" style="font-size:13px;line-height:1.5;background:#fff5ec;padding:10px;border-radius:8px"></p><div id="scene"><div id="sceneLabel"></div><div id="effect"></div><div id="guest">😐</div><div id="therapist">🧑‍⚕️</div></div></div><div class="card"><h3>实时状态</h3><div id="meters" class="meters"></div><p id="results"></p><h3>服务选择</h3><div id="actions"></div><button id="skill">⚡ 释放技能（100 能量）</button><button id="appeal">📋 有证据申诉（示例：3条）</button><h3>事件日志</h3><div id="log"></div></div></div><p class="sub">注：这是无需后端的规则引擎验证器，并非最终的按摩手势与骨骼动画成品。广告只预留事件接口，不播放真实广告。</p></div><script type="module">
import {therapists,guests,services,scenes,newGame,act,useSkill,complaintAppeal} from './engine.js';
const $=id=>document.getElementById(id);for(const [id,items] of [['therapist',therapists],['guest',guests],['sceneChoice',scenes]]){$(id).innerHTML=items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
let state=newGame();const labels=[['comfort','舒适值'],['affection','好感度'],['patience','忍耐值'],['complaint','投诉风险'],['inspection','查房风险'],['energy','技能能量']];
function render(){let g=guests.find(x=>x.id===state.guestId);$('characterInfo').textContent=(()=>{let t=therapists.find(x=>x.id===state.therapistId);return `${t.name}｜${t.appearance}｜专精：${t.trait}｜专属表演：${t.animationSet}`})();$('intro').textContent=`${g.name} · ${g.disposition} · 通关舒适目标：${g.goal}`;$('meters').innerHTML=labels.map(([key,name])=>`<div class="meter"><span>${name}</span><div class="track"><div class="fill" style="width:${state[key]}%;background:${key==='complaint'||key==='inspection'?'#d85d5d':key==='comfort'?'#71aa8f':'#d99b73'}"></div></div><b>${state[key]}</b></div>`).join('');$('sceneLabel').textContent=scenes.find(x=>x.id===state.scene).name;$('guest').textContent=state.mood==='happy'?'🥰':state.mood==='angry'?'😡':state.mood==='shock'?'😱':g.look;$('therapist').textContent=therapists.find(x=>x.id===state.therapistId)?.gender==='女'?'👩‍⚕️':'🧑‍⚕️';$('results').textContent=`回合 ${state.turns}/25 · 金币 ${state.coins} · ${state.status==='playing'?'服务中':state.status==='won'?'✅ 通关':'❌ 失败：'+state.status}`;$('actions').innerHTML=services.filter(s=>s.scene.includes(state.scene)).map(s=>`<button data-service="${s.id}" ${state.status!=='playing'?'disabled':''}>${s.name}${s.cost?` (-${s.cost}币)`:''}</button>`).join('');$('log').textContent=state.logs.slice(-10).reverse().join('\n');$('effect').textContent=state.status==='won'?'✨ PERFECT!':state.status!=='playing'?'💥 GAME OVER':'';document.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>{state=act(state,b.dataset.service);render()}))}
$('start').onclick=()=>{state=newGame($('therapist').value,$('guest').value,$('sceneChoice').value);render()};$('skill').onclick=()=>{state=useSkill(state);render()};$('appeal').onclick=()=>{state=complaintAppeal(state,3);render()};render();
</script></body></html>
