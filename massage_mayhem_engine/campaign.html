<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Massage Mayhem - 关卡与技师轮盘</title><style>body{background:#f7eee6;color:#43323a;font:16px system-ui;margin:0;padding:20px}main{max-width:750px;margin:auto}section{background:white;padding:22px;border-radius:20px;margin:14px 0;border:2px solid #ead5cb}button,select{padding:10px;border:1px solid #bb9c98;border-radius:9px;background:#ffe0c2;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.carousel{display:flex;align-items:center;justify-content:center;gap:16px}.profile{width:280px;min-height:175px;text-align:center;background:#ffefe7;border-radius:16px;padding:18px}.locked{filter:grayscale(1);opacity:.65}.name{font-size:24px;font-weight:bold}.sub{color:#816d73;font-size:14px}#notice{background:#fff0ad;padding:12px;border-radius:10px;display:none}#log{white-space:pre-line}</style></head><body><main><h1>💆 疯狂按摩店</h1><p>v1.3 主界面与关卡导演系统（可交互原型；未接正式按摩操作）</p><section><h2>当前出战技师</h2><div class="carousel"><button id="prev">❮</button><div class="profile" id="profile"></div><button id="next">❯</button></div><p id="balance"></p><div style="text-align:center"><button id="unlock"></button></div><p class="sub">左右循环浏览全部技师；未解锁角色灰显并显示 🔒。</p></section><section><h2>选择关卡</h2><select id="level"></select><p id="description"></p><button id="start">生成该关顾客</button><div id="notice"><p id="offer"></p><button id="accept">接受神秘客高难委托</button><button id="decline">维持普通订单</button></div><p id="log"></p><button id="win" disabled>模拟本关胜利</button><button id="lose" disabled>模拟本关失败</button></section><p class="sub">概率和奖励为策划模拟数值。正式版由 Phaser 表现层调用独立规则引擎。</p></main><script type="module">
import {therapists,guests} from './engine.js';
const $=id=>document.getElementById(id);let progress={unlockedLevel:1,coins:0,unlockedTherapists:['charming_m','charming_f'],rareLastLevel:-100,rareWins:0,completed:[]},idx=0,pending=null,selected=null,levelData=[];const rand=(seed)=>{let x=Math.sin(seed*9281+43)*10000;return x-Math.floor(x)};
fetch('./levels.json').then(r=>r.json()).then(a=>{levelData=a;render()});
function render(){let t=therapists[idx],ok=progress.unlockedTherapists.includes(t.id);$('profile').className='profile'+(ok?'':' locked');$('profile').innerHTML=`<div style="font-size:40px">${ok?'💆':'🔒'}</div><div class="name">${t.name}</div><div class="sub">${t.appearance}</div><p>${t.trait}</p>`;$('balance').textContent=`金币：${progress.coins} · 已到达关卡：${progress.unlockedLevel}`;$('unlock').textContent=ok?'已解锁':`金币解锁 · ${t.cost}`;$('unlock').disabled=ok||progress.coins<t.cost;$('level').innerHTML=levelData.filter(x=>x.level<=progress.unlockedLevel).map(x=>`<option value="${x.level}">第 ${x.level} 关 · ${x.chapter}</option>`).join('');if(selected)$('level').value=String(selected);describe()}
function describe(){let c=levelData[Number($('level').value)-1];if(c)$('description').textContent=`难度 ${c.difficulty}/5 · 目标舒适 ${c.comfortGoal} · ${c.scenePool.join(' / ')} · 事件：${c.events.join('、')} · 稀有客概率 ${Math.round(c.rareChance*100)}%`}
$('prev').onclick=()=>{idx=(idx+therapists.length-1)%therapists.length;render()};$('next').onclick=()=>{idx=(idx+1)%therapists.length;render()};$('unlock').onclick=()=>{let t=therapists[idx];if(progress.coins>=t.cost){progress.coins-=t.cost;progress.unlockedTherapists.push(t.id);render()}};
$('level').onchange=()=>{selected=Number($('level').value);describe()};
function setResult(on){$('win').disabled=!on;$('lose').disabled=!on}
function commit(rare){pending.rare=rare;let id=rare?'tricky':pending.guest;let g=guests.find(x=>x.id===id);$('notice').style.display='none';$('log').textContent=`已生成：${g.name}${rare?' · ★ 神秘稀有客':''}
偏好：${g.disposition}
目标：${pending.config.comfortGoal+(rare?18:0)}
本原型按“模拟胜利/失败”测试解锁逻辑，实际操作请用 index.html。`;setResult(true)}
$('start').onclick=()=>{const t=therapists[idx];if(!progress.unlockedTherapists.includes(t.id)){alert('该技师尚未解锁');return}let lv=Number($('level').value),cfg=levelData[lv-1],roll=rand(lv*719+progress.coins+progress.completed.length*13),guest=cfg.guestPool[Math.floor(rand(lv*117+progress.coins)*cfg.guestPool.length)],rare=lv>=8&&lv-progress.rareLastLevel>=3&&roll<cfg.rareChance;pending={level:lv,config:cfg,guest,rare:false};setResult(false);if(rare){$('notice').style.display='block';$('offer').textContent='🔔 神秘顾客突然到访！困难委托，通关奖励 ×2.5。接受还是继续普通订单？'}else{commit(false)}};
$('accept').onclick=()=>commit(true);$('decline').onclick=()=>commit(false);
function finish(won){if(!pending)return;let p=pending,c=p.config;if(won){progress.coins+=Math.round(c.baseCoins*(p.rare?2.5:1));progress.unlockedLevel=Math.max(progress.unlockedLevel,Math.min(30,p.level+1));progress.completed.push(p.level)}if(p.rare)progress.rareLastLevel=p.level;$('log').textContent+=`
${won?'✅ 通关':'❌ 失败'}；${won?`金币 +${Math.round(c.baseCoins*(p.rare?2.5:1))}`:'无奖励'}。`;pending=null;setResult(false);render()};$('win').onclick=()=>finish(true);$('lose').onclick=()=>finish(false);
</script></body></html>
